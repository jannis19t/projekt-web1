<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" href="img/logo.png">
    <title>Home | Valo Hub</title>
</head>

<body>
    <header>
        <nav id="navbar">
            <a href="index.html"><img src="img/logo.png" alt="logo-valo"></a>
            <ul>
                <li><a href="index.html" class="list-item active">Domů</a></li>
                <li><a href="agents.html" class="list-item">Agenti</a></li>
                <li><a href="index.html" class="list-item">Mapy</a></li>
                <li><a href="index.html" class="list-item">Zbraně</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <span class="badge">Nová sezóna</span>
        <h1>Bránit. Útočit. Vyhrát kola.</h1>
        <p>Taktické 5v5 hry, unikátní agenti a mapy, které vyžadují přesnou mušku i týmovou hru.</p>
        <div class="hero-buttons">
            <a href="https://playvalorant.com/en-us/?utm_medium=card2%2Bwww.riotgames.com&utm_source=riotbar"
                class="btn btn-primary" target="_blank">Začít hrát</a>
            <a href="agents.html" class="btn btn-outline">Prohlédnout agenty</a>
        </div>

        <div class="stats-grid">
            <div class="stats">
                <div class="stats-box">
                    <span class="stats-label">Agenti</span>
                    <span class="stats-number">29</span>
                </div>
                <div class="stats-box">
                    <span class="stats-label">Mapy</span>
                    <span class="stats-number">12</span>
                </div>
                <div class="stats-box">
                    <span class="stats-label">Herní režimy</span>
                    <span class="stats-number">8</span>
                </div>
            </div>
        </div>
    </section>

    <section class="agents">
        <span class="header-agents">Oblíbení agenti</span>
        <div class="fav-grid">
            <div class="fav-agents">
                <div class="fav-box">
                    <img src="img/jett.png" alt="Jett" class="agent-img">
                    <span class="fav-label">Jett</span>
                    <span class="fav-type">Duelista</span>
                </div>
            </div>

            <div class="fav-agents">
                <div class="fav-box">
                    <img src="img/jett.png" alt="Jett" class="agent-img">
                    <span class="fav-label">Jett</span>
                    <span class="fav-type">Duelista</span>
                </div>
            </div>

            <div class="fav-agents">
                <div class="fav-box">
                    <img src="img/jett.png" alt="Jett" class="agent-img">
                    <span class="fav-label">Jett</span>
                    <span class="fav-type">Duelista</span>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
